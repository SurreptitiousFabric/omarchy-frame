name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qml-contract:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 10
    steps:
      - name: Install QML validation dependencies
        run: pacman -Syu --noconfirm git quickshell qt6-declarative

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out pinned Omarchy QML APIs
        shell: bash
        run: |
          git init "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" remote add origin https://github.com/basecamp/omarchy.git
          git -C "$RUNNER_TEMP/omarchy" fetch --depth=1 origin dec29fa90afc3d16a7e0c487c1869c7e512282ca
          git -C "$RUNNER_TEMP/omarchy" checkout --detach FETCH_HEAD

      - name: Validate complete widget QML contracts
        env:
          FRAME_REQUIRE_QMLLINT: "1"
        run: |
          export OMARCHY_QML_ROOT="$RUNNER_TEMP/omarchy/shell"
          scripts/test-qml-types.sh
          scripts/test-qml-policy.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n $unformatted ]]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce coverage floor
        shell: bash
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 75) exit 1 }'
          echo "Backend coverage: ${coverage}%"

      - name: Vet
        run: go vet ./...

      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build release binaries
        run: |
          scripts/build-release.sh
          git diff --exit-code -- bin

      - name: Validate repository and checksums
        run: |
          scripts/validate-repository.sh
          scripts/test-repository-policy.sh

      - name: Package CI artifact
        run: scripts/package-release.sh omarchy-frame-linux.tar.gz

      - name: Upload CI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omarchy-frame-linux
          path: omarchy-frame-linux.tar.gz
          if-no-files-found: error
