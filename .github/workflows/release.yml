name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qml-contract:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 10
    steps:
      - name: Install QML validation dependencies
        run: pacman -Syu --noconfirm git quickshell qt6-declarative

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out pinned Omarchy QML APIs
        shell: bash
        run: |
          git init "$RUNNER_TEMP/omarchy"
          git -C "$RUNNER_TEMP/omarchy" remote add origin https://github.com/basecamp/omarchy.git
          git -C "$RUNNER_TEMP/omarchy" fetch --depth=1 origin dec29fa90afc3d16a7e0c487c1869c7e512282ca
          git -C "$RUNNER_TEMP/omarchy" checkout --detach FETCH_HEAD

      - name: Validate complete widget QML contracts
        env:
          FRAME_REQUIRE_QMLLINT: "1"
        run: |
          export OMARCHY_QML_ROOT="$RUNNER_TEMP/omarchy/shell"
          scripts/test-qml-types.sh
          scripts/test-qml-policy.sh

  release:
    needs: qml-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Require release-ready metadata
        run: scripts/check-release-readiness.sh "$GITHUB_REF_NAME"

      - name: Test and build
        run: |
          go test -race -coverprofile=coverage.out ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
          scripts/build-release.sh
          git diff --exit-code -- bin
          scripts/validate-repository.sh
          scripts/test-repository-policy.sh

      - name: Package deterministic release archive
        shell: bash
        run: |
          archive="omarchy-frame-${GITHUB_REF_NAME#v}-linux.tar.gz"
          scripts/package-release.sh "$archive"
          sha256sum "$archive" > "$archive.sha256"
          echo "RELEASE_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" bin/frame-controller bin/frame-controller-linux-amd64 bin/frame-controller-linux-arm64 bin/SHA256SUMS "$RELEASE_ARCHIVE" "$RELEASE_ARCHIVE.sha256" --verify-tag --generate-notes
